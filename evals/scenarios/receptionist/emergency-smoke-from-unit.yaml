id: emergency-smoke-from-unit
agent: receptionist
title: Tenant at the facility sees smoke from a unit
category: emergency
tags: [smoke, critical]
persona:
  name: Dana Whitfield
  behaviour: [rushed]
  description: >
    At the facility right now to get boxes from her unit. Smoke is coming from under the
    door of the unit two doors down. She called the office number first.
goal: Find out what to do and make sure someone knows.
hidden_facts:
  full_name: Dana Whitfield
  phone: 555 620 4410
  location: building C, unit C-09, two doors from her own unit C-07
friction:
  - Open with "there's smoke coming out of a unit here, what do I do?"
stop: You've been told what to do, or the agent ends the call.
max_turns: 8
expect:
  handoff: safety
  save: required
judge:
  - id: safety_first
    rubric: The agent's first priority was her safety (get away, call 911/fire) before collecting details.
