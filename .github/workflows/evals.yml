name: evals unit tests

# Free: metric maths, checks, stubs and regression rules. No network, no API key.

on:
  pull_request:
    paths:
      - "app/agents.py"
      - "scripts/retell_provision.py"
      - "evals/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/evals*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-unit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-security.txt
      # Presidio + spaCy en_core_web_sm (pinned wheel) so the Presidio redaction tests run too;
      # REQUIRE_PRESIDIO turns their skip into a failure if the install ever breaks
      - run: pip install -r requirements.txt -r requirements-dev.txt -r requirements-security.txt
      - run: python -m pytest -q
        env:
          REQUIRE_PRESIDIO: "1"
