name: agent evals

# On every pull request that touches an agent (prompt doc, registry data) or the suite:
#   1. unit tests for the metric maths and checks (free, no network)
#   2. smoke run: the scenarios tagged `smoke`, k=1, compared with the committed
#      gpt-4o-mini baselines; fails the PR on a regression. Needs the OPENAI_API_KEY
#      repository secret; skipped (not failed) when it isn't set, e.g. on forks.

on:
  pull_request:
    paths:
      - "docs/RETELL-SETUP.md"
      - "app/agents.py"
      - "scripts/retell_provision.py"
      - "evals/**"
      - "tests/**"
      - "requirements*.txt"
      - ".github/workflows/evals.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  smoke:
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Skip without an API key
        if: env.OPENAI_API_KEY == ''
        run: echo "::notice::OPENAI_API_KEY secret not set; smoke evals skipped."
      - uses: actions/checkout@v4
        if: env.OPENAI_API_KEY != ''
      - uses: actions/setup-python@v5
        if: env.OPENAI_API_KEY != ''
        with:
          python-version: "3.12"
          cache: pip
      - if: env.OPENAI_API_KEY != ''
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Smoke evals vs baseline (k=1, $0.25 cap)
        if: env.OPENAI_API_KEY != ''
        shell: bash
        run: |
          python -m evals run --all --tag smoke --k 1 --max-cost 0.25 --workers 4 | tee evals-smoke.txt
      - name: Job summary
        if: always() && env.OPENAI_API_KEY != ''
        shell: bash
        run: |
          { echo '```'; sed -n '/^agent /,$p' evals-smoke.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && env.OPENAI_API_KEY != ''
        with:
          name: evals-smoke-results
          path: |
            evals-smoke.txt
            evals/results/run-*.json
          retention-days: 14
