{% set og = OG.get(agent.id) if agent is defined and agent and agent.id is defined else OG.get(og_key) %}
{% if og %}
<meta name="description" content="{{ og.desc }}"/>
<meta property="og:type" content="website"/>
<meta property="og:site_name" content="VoiceDesk by Adel Atya"/>
<meta property="og:title" content="{{ og.title }}"/>
<meta property="og:description" content="{{ og.desc }}"/>
<meta property="og:url" content="{{ (request.url|string).replace("http://","https://") }}"/>
<meta property="og:image" content="{{ (request.base_url|string).replace("http://","https://") }}static/og/{{ og.img }}.png"/>
<meta property="og:image:width" content="1200"/><meta property="og:image:height" content="630"/>
<meta name="twitter:card" content="summary_large_image"/>
<meta name="twitter:image" content="{{ (request.base_url|string).replace("http://","https://") }}static/og/{{ og.img }}.png"/>
{% endif %}
