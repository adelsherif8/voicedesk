services:
  - type: web
    name: voicedesk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: EVALS_INGEST_TOKEN   # lets `python -m evals ... --publish <render url>` post runs; set in the Render dashboard
        sync: false
      - key: RETELL_API_KEY       # server only; without it the "Talk to this agent" button is hidden
        sync: false
      - key: RETELL_AGENT_IDS     # JSON map of page slug to Retell agent id
        sync: false
      - key: WEB_CALL_CLIENT_IP_HEADER   # Render sits behind Cloudflare, which overwrites this header
        value: cf-connecting-ip
