services:
  - type: web
    name: voicedesk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: EVALS_INGEST_TOKEN   # lets `python -m evals ... --publish <render url>` post runs; set in the Render dashboard
        sync: false
